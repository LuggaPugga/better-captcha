name: Setup Playwright
description: Setup Playwright with browser caching (Bun)
inputs:
  working-directory:
    description: Package directory that depends on @playwright/test
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Extract Playwright version
      id: playwright-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        version=$(node -p "require('playwright-core/package.json').version")
        echo "PLAYWRIGHT_VERSION=$version" >> "$GITHUB_ENV"

    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

    - name: Install Playwright Browsers
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      working-directory: ${{ inputs.working-directory }}
      run: bunx playwright install --with-deps chromium firefox webkit

    - name: Install Playwright system dependencies
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      working-directory: ${{ inputs.working-directory }}
      run: bunx playwright install-deps chromium firefox webkit
