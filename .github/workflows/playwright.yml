name: Playwright Tests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The container's browsers must match the installed Playwright version exactly,
  # so derive the image tag from bun.lock instead of hardcoding it.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: bun.lock
          sparse-checkout-cone-mode: false

      - name: Resolve Playwright version from bun.lock
        id: resolve
        run: |
          versions=$(grep -oE '\["playwright@[0-9]+\.[0-9]+\.[0-9]+[^"]*"' bun.lock | sed -E 's/.*@([^"]+)"/\1/' | sort -u)
          count=$(printf '%s\n' "$versions" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one resolved playwright version in bun.lock, found: ${versions:-none}"
            exit 1
          fi
          echo "Resolved playwright@$versions"
          echo "version=$versions" >> "$GITHUB_OUTPUT"

  test:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system dependencies come preinstalled in the image.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    env:
      # Firefox refuses to start as root when HOME is owned by another user.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        project: [react, solidjs, vue, qwik, svelte, lit, preact]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # oven-sh/setup-bun needs unzip, which the Playwright image does not ship.
      - name: Set up Bun
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Core
        run: bun run --cwd packages/core build

      - name: Build package
        run: bun run --cwd packages/${{ matrix.project }} build

      - name: Run Playwright tests
        run: bun --cwd packages/${{ matrix.project }} playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: packages/${{ matrix.project }}/playwright-report/
          retention-days: 30
