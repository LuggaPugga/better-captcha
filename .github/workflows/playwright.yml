name: Playwright Tests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system dependencies come preinstalled in the image.
    # Keep the tag in sync with the resolved @playwright/test version in bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox refuses to start as root when HOME is owned by another user.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        project: [react, solidjs, vue, qwik, svelte, lit, preact]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # oven-sh/setup-bun needs unzip, which the Playwright image does not ship.
      - name: Set up Bun
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Core
        run: bun run --cwd packages/core build

      - name: Build package
        run: bun run --cwd packages/${{ matrix.project }} build

      - name: Run Playwright tests
        run: bun --cwd packages/${{ matrix.project }} playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: packages/${{ matrix.project }}/playwright-report/
          retention-days: 30
